services:
  api:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: cache
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    # --- Hardening ---
    read_only: true          # container's own filesystem is read-only at runtime
    tmpfs:
      - /tmp                 # ...except a small in-memory scratch dir, if the app ever needs one
    cap_drop:
      - ALL                  # drop every Linux capability the process doesn't explicitly need
    security_opt:
      - no-new-privileges:true   # the process (or anything it execs) can never gain more privilege than it started with

  db:
    image: postgres:16
    env_file:
      - .env
    volumes:
      - notes-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5

  cache:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  notes-db-data:
