# Reference example kept inside this topic folder for the course.
# GitHub Actions only picks up workflows under .github/workflows/ at a
# REPOSITORY ROOT — in a real project, this file would live at
# <repo-root>/.github/workflows/docker-ci.yml, not nested inside a subfolder.
name: Docker CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Runs the "tester" stage from the Dockerfile — this is the actual
      # test run. If pytest fails inside it, `docker build` exits non-zero
      # and this step (and the whole job) fails.
      - name: Run tests (tester build stage)
        run: docker build --target tester -t notes-api:test .

      # Only reached if the tests above passed.
      - name: Build the runtime image
        run: docker build -t notes-api:${{ github.sha }} .

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag notes-api:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/notes-api:${{ github.sha }}
          docker tag notes-api:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/notes-api:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/notes-api:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/notes-api:latest
